<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }
    .pulsing-orb {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .particle {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: dashCycle 2s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .badge-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambient Orbs (Background) -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" class="pulsing-orb" opacity="0.2" />
  <circle cx="1050" cy="280" r="160" fill="#818cf8" filter="url(#glow)" class="pulsing-orb" opacity="0.2" />
  <circle cx="600" cy="180" r="180" fill="#c084fc" filter="url(#glow)" class="pulsing-orb" opacity="0.15" />

  <!-- Animated Circuit & Data Flow Lines (Midground) -->
  <path d="M 50 180 Q 300 240 600 180 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" class="flow-line" />
  <path d="M 80 90 Q 400 30 750 100 T 1120 70" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.3" class="flow-line" style="animation-direction: reverse; animation-duration: 3s;" />
  <path d="M 70 290 Q 450 330 850 270 T 1130 300" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.3" class="flow-line" style="animation-duration: 2.5s;" />

  <!-- Floating Particles / Hex Byte Nodes -->
  <circle cx="220" cy="110" r="3" fill="#38bdf8" class="particle" />
  <circle cx="980" cy="140" r="3.5" fill="#c084fc" class="particle" style="animation-duration: 7s;" />
  <circle cx="450" cy="300" r="2.5" fill="#818cf8" class="particle" style="animation-duration: 6s;" />
  <circle cx="820" cy="70" r="3" fill="#38bdf8" class="particle" style="animation-duration: 4.5s;" />

  <!-- Binary Matrix Elements (Left & Right Flanks) -->
  <g opacity="0.22" fill="#38bdf8" font-family="monospace" font-size="12">
    <text x="40" y="50">0x4D 0x5A 0x90</text>
    <text x="40" y="70">0xE8 0x00 0x00</text>
    <text x="40" y="90">0x55 0x89 0xE5</text>
    <text x="40" y="110">0x48 0x83 0xEC</text>
    <text x="40" y="130">0xFF 0x25 0x00</text>
    <text x="40" y="270">0x31 0xC0 0xC3</text>
    <text x="40" y="290">0x0F 0x05 0x90</text>
    <text x="40" y="310">0x75 0x1A 0x48</text>
  </g>
  <g opacity="0.22" fill="#c084fc" font-family="monospace" font-size="12">
    <text x="1060" y="50">vmovdqu ymm0</text>
    <text x="1060" y="70">call sym_imp</text>
    <text x="1060" y="90">push rbp; ret</text>
    <text x="1060" y="110">xor eax, eax</text>
    <text x="1060" y="130">mcp::dispatch</text>
    <text x="1060" y="270">ghidra::decom</text>
    <text x="1060" y="290">agent.analyze</text>
    <text x="1060" y="310">0x7F 'E' 'L' 'F'</text>
  </g>

  <!-- Foreground Main Title & Badges (Clean, unobstructed) -->
  <g>
    <!-- Top Super-Category Tag -->
    <g transform="translate(600, 75)">
      <rect x="-185" y="-14" width="370" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="0" y="4" text-anchor="middle" fill="#38bdf8" class="badge-text">⚡ REVERSE ENGINEERING &amp; BINARY ANALYSIS AGENTS</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="600" y="145" text-anchor="middle" fill="url(#accentGrad)" font-size="44" class="title-text">
      Awesome Reverse Engineering Agents
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" text-anchor="middle" fill="#94a3b8" font-size="16" class="sub-text">
      Autonomous AI Agents • Decompiler Bridges • MCP Tooling • Dynamic Sandboxing
    </text>

    <!-- Dynamic Technology Cards / Category Pills in Foreground Bottom -->
    <g transform="translate(600, 248)">
      <!-- Pill 1: AI Agents -->
      <g transform="translate(-370, 0)">
        <rect x="0" y="0" width="165" height="38" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="20" cy="19" r="5" fill="#38bdf8" />
        <text x="35" y="23" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">AI Agents &amp; MCP</text>
      </g>
      <!-- Pill 2: Decompilers -->
      <g transform="translate(-185, 0)">
        <rect x="0" y="0" width="170" height="38" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="20" cy="19" r="5" fill="#818cf8" />
        <text x="35" y="23" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Neural Decompilers</text>
      </g>
      <!-- Pill 3: Sandboxes -->
      <g transform="translate(5, 0)">
        <rect x="0" y="0" width="170" height="38" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="20" cy="19" r="5" fill="#c084fc" />
        <text x="35" y="23" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Malware Sandboxes</text>
      </g>
      <!-- Pill 4: SRE Frameworks -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="175" height="38" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="20" cy="19" r="5" fill="#38bdf8" />
        <text x="35" y="23" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Binary Instrumentation</text>
      </g>
    </g>

    <!-- Bottom Metrics / Tagline -->
    <text x="600" y="325" text-anchor="middle" fill="#64748b" font-size="13" class="sub-text">
      Curated ecosystem of SaaS platforms &amp; open-source toolkits for modern binary security research
    </text>
  </g>
</svg>
